name: MAE APS - Importador V2 (validacao independente)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/siaps/**"
      - "src/components/siaps/**"
      - "src/app/api/importacoes/**"
      - "src/app/(sistema)/sistema/administracao/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/siaps/**"
      - "tests/e2e/import.spec.ts"
      - ".github/workflows/validate-import-v2.yml"

permissions:
  contents: read

concurrency:
  group: import-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  importer-checks:
    name: Parser, tipos, lint e build (não substitui audit de segurança)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_000000000000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes de reconhecimento e segurança V2
        run: npm test -- tests/siaps/discovery-v2.test.ts tests/siaps/importer-v2-safety.test.ts tests/siaps/parser.test.ts
      - name: Checar tipos
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build Next.js de desenvolvimento
        run: npm run build

  db-integration:
    name: Supabase local e pgTAP V2 (sem banco de produção)
    needs: importer-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Preparar imagens de Postgres e pgTAP
        shell: bash
        run: |
          docker pull ghcr.io/supabase/postgres:17.6.1.167
          docker tag ghcr.io/supabase/postgres:17.6.1.167 public.ecr.aws/supabase/postgres:17.6.1.167
          docker pull ghcr.io/supabase/pg_prove:3.36
          docker tag ghcr.io/supabase/pg_prove:3.36 public.ecr.aws/supabase/pg_prove:3.36
      - name: Inicializar Supabase local
        run: npx supabase start -x logflare,vector,realtime,storage-api,imgproxy,edge-runtime,postgres-meta,studio,supavisor
      - name: Construir esquema e executar migrações em banco descartável
        run: npx supabase db reset
      - name: Executar testes SQL pgTAP
        run: npx supabase test db
      - name: Encerrar Supabase local
        if: always()
        run: npx supabase stop
