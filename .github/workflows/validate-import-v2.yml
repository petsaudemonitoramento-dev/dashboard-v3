name: MAE APS - Importador V2 (validacao independente)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lib/siaps/**"
      - "src/components/siaps/**"
      - "src/app/api/importacoes/**"
      - "src/app/(sistema)/sistema/administracao/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "tests/siaps/**"
      - "tests/e2e/import.spec.ts"
      - ".github/workflows/validate-import-v2.yml"

permissions:
  contents: read

concurrency:
  group: import-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  importer-checks:
    name: Parser, tipos, lint e build (não substitui audit de segurança)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_000000000000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes de reconhecimento e segurança V2
        run: npm test -- tests/siaps/discovery-v2.test.ts tests/siaps/importer-v2-safety.test.ts tests/siaps/parser.test.ts
      - name: Checar tipos
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Build Next.js de desenvolvimento
        run: npm run build
