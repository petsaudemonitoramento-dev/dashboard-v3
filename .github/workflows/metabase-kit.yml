name: MAE APS - Pacote Metabase

on:
  pull_request:
    paths:
      - "deploy/metabase/**"
      - ".github/workflows/metabase-kit.yml"
  push:
    branches: [main]
    paths:
      - "deploy/metabase/**"
      - ".github/workflows/metabase-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar pacote Docker sem dados de producao
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validar scripts
        run: bash -n deploy/metabase/*.sh
      - name: Validar compose e sigilo de portas
        shell: bash
        run: |
          set -euo pipefail
          cd deploy/metabase
          cat > .env <<'EOF'
          METABASE_PORT=3000
          METABASE_APP_DB_PASSWORD=CI_ONLY_NOT_REAL_PASSWORD_123456789
          MB_ENCRYPTION_SECRET_KEY=Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0wMDAwMDAwMDA=
          MB_SESSION_SECRET_KEY=Y2ktdGVzdC1zZXNzaW9uLWtleS0wMDAwMDAwMDAw
          EOF
          chmod 600 .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env -f compose.yaml config --quiet
          docker compose --env-file .env -f compose.yaml config --format json | python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          services = config["services"]
          metabase_ports = services["metabase"]["ports"]
          assert len(metabase_ports) == 1, metabase_ports
          assert metabase_ports[0].get("host_ip") == "127.0.0.1", metabase_ports
          assert not services["app-db"].get("ports"), "PostgreSQL exposto na maquina"
          assert "metabase_app_pgdata" in services["app-db"]["volumes"][0]["source"]
          print("Compose valido; Metabase restrito a localhost e PostgreSQL sem porta publica.")
          '
      - name: Criar kit portatil sem credenciais
        run: |
          cd deploy/metabase
          zip -q -r ../../maeaps-metabase-kit.zip compose.yaml .env.example bootstrap.sh start.sh backup.sh verify.sh README.md
      - uses: actions/upload-artifact@v4
        with:
          name: maeaps-metabase-kit
          path: maeaps-metabase-kit.zip
          if-no-files-found: error
          retention-days: 30
