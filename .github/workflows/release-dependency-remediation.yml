name: MAE APS - Security dependency remediation (release only)
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/release-dependency-remediation.yml"]
permissions:
  contents: write
jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'release/mae-aps-pr16-pr17-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Atualizar Next.js e ESLint Next com versões corrigidas
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0 --ignore-scripts
      - name: Aplicar resoluções de vulnerabilidades transitivas
        run: |
          npm pkg set 'overrides.sharp=0.35.5' 'overrides.source-map-js=1.2.2'
          npm install --package-lock-only --ignore-scripts
      - name: Auditar dependências de runtime
        run: npm audit --omit=dev --audit-level=high
      - name: Conferir lockfile
        run: npm ci --ignore-scripts
      - name: Criar commit de correção apenas na branch de release
        run: |
          git config user.name 'mae-aps-security-ci'
          git config user.email 'mae-aps-security-ci@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "fix(deps): patch Next, Sharp and source-map-js security advisories"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
