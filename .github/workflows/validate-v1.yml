name: MAE APS - Validacao V1

on:
  workflow_dispatch:
  push:
    branches:
      - codex/bootstrap-v3
      - integration/v1-audit

permissions:
  contents: read

jobs:
  validate-v1:
    name: Validar aplicacao, migrations e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_000000000000
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npx supabase start -x logflare,vector,kong,gotrue,mailpit,realtime,postgrest,storage-api,imgproxy,edge-runtime,postgres-meta,studio,supavisor; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Supabase local não iniciou após 4 tentativas."
              exit 1
            fi
            wait_seconds=$((attempt * 15))
            echo "Falha transitória ao iniciar Supabase; nova tentativa em ${wait_seconds}s..."
            sleep "$wait_seconds"
          done

      - name: Rebuild database from migrations
        run: npx supabase db reset

      - name: SQL and RLS tests
        run: npx supabase test db

      - name: Supabase status
        if: always()
        run: npx supabase status || true

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
