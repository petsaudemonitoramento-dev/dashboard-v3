name: MAE APS - Validacao V1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v1:
    name: Validar aplicacao, migrations e RLS
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://ci-validation.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_validation_only_000000000000
      SUPABASE_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Supabase CLI version
        run: npx supabase --version

      - name: Start local Supabase
        run: npx supabase start

      - name: Rebuild database from migrations
        run: npx supabase db reset

      - name: SQL and RLS tests
        run: npx supabase test db

      - name: Supabase status
        if: always()
        run: npx supabase status

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
